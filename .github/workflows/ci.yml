name: service-a-ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE_NAME: ghcr.io/cbssmh/golden-path-service-a
  PYTHON_VERSION: '3.12.12'
  BUILDX_VERSION: v0.37.1
  # yamllint disable-line rule:line-length
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  # yamllint disable-line rule:line-length
  BUILDKIT_IMAGE: docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify Python version
        run: test "$(python --version | awk '{print $2}')" = "${PYTHON_VERSION}"
      - name: Test
        run: python -m unittest discover -s tests -v
      # docker/setup-qemu-action v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      # docker/setup-buildx-action v3
      # yamllint disable-line rule:line-length
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
      - name: Verify Buildx version
        run: |
          actual_buildx="$(docker buildx version | awk '{print $2}')"
          test "${actual_buildx}" = "${BUILDX_VERSION}"
      # docker/build-push-action v6
      # yamllint disable-line rule:line-length
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  publish:
    if: github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # docker/setup-qemu-action v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
      # docker/setup-buildx-action v3
      # yamllint disable-line rule:line-length
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
      - name: Verify Buildx version
        run: |
          actual_buildx="$(docker buildx version | awk '{print $2}')"
          test "${actual_buildx}" = "${BUILDX_VERSION}"
      # docker/login-action v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/build-push-action v6
      # yamllint disable-line rule:line-length
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
